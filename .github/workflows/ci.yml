name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos (TypeScript)
        run: npm run typecheck

      - name: Tests (JS: parser QR + validación del generador)
        run: npm test

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: json, mbstring

      - name: Tests (PHP: comprobador de boletos y décimos)
        run: npm run test:php

      - name: Compilar (Vite)
        run: npm run build
