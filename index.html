<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente de Loterías Los Patios 70</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://aistudiocdn.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-gold': '#EAB308',
              'brand-black': '#1a1a1a',
              'brand-white': '#ffffff',
            },
            animation: {
                scroll: 'scroll 30s linear infinite',
                'fade-in-up': 'fade-in-up 0.3s ease-out forwards',
            },
            keyframes: {
                scroll: {
                    '0%': { transform: 'translateX(0)' },
                    '100%': { transform: 'translateX(-50%)' },
                },
                'fade-in-up': {
                    '0%': { opacity: '0', transform: 'translateY(10px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "jsqr": "https://aistudiocdn.com/jsqr@^1.4.0"
  }
}
</script>
<style>
    .group:hover .animate-scroll {
        animation-play-state: paused;
    }
</style>
</head>
<body class="bg-brand-black text-gray-100 antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-black to-brand-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
